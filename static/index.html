<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant - Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status.idle {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.listening {
            background: #fff3e0;
            color: #e65100;
            animation: pulse 2s ease-in-out infinite;
        }

        .status.processing {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .status.speaking {
            background: #e8f5e9;
            color: #2e7d32;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 200px;
        }

        .start-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stop-btn {
            background: #f44336;
            color: white;
        }

        /* Промежуточный текст */
        .partial-container {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            display: block;
            /* Всегда видим */
        }

        /* Скрываем только если текст действительно пустой */
        .partial-container:has(.partial-text:empty) {
            display: none;
        }

        .partial-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .partial-text {
            font-size: 16px;
            color: #333;
            font-style: italic;
        }

        /* Контейнер для обоих эквалайзеров */
        .visualizers-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        /* Эквалайзер записи */
        .visualizer-container {
            flex: 1;
            display: block;
            /* Всегда видим */
        }

        #visualizer {
            width: 100%;
            height: 80px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .volume-indicator {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        /* Эквалайзер воспроизведения */
        .playback-visualizer-container {
            flex: 1;
            display: block;
            /* Всегда видим */
        }

        #playback-visualizer {
            width: 100%;
            height: 80px;
            background: #e8f5e9;
            border-radius: 10px;
        }

        .playback-label {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #2e7d32;
            font-weight: 500;
        }

        /* История диалога */
        .conversation {
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .message.assistant {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }

        .message-label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message.user .message-label {
            color: #1976d2;
        }

        .message.assistant .message-label {
            color: #7b1fa2;
        }

        .message-text {
            color: #333;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
            /* Сохраняем пробелы и переносы */
        }

        .audio-player {
            margin-top: 10px;
            width: 100%;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        .info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #856404;
        }

        .model-selector-container {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .model-selector-label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .model-selector {
            flex: 1;
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .model-selector:hover {
            border-color: #764ba2;
        }

        .model-selector:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎤 Голосовой Ассистент</h1>
        <div class="subtitle">Потоковое распознавание • Непрерывный диалог</div>

        <div class="model-selector-container">
            <label class="model-selector-label">🤖 Модель:</label>
            <select id="modelSelector" class="model-selector" onchange="changeModel()">
                <option value="">Загрузка...</option>
            </select>
        </div>

        <div id="status" class="status idle">
            Готов к работе
        </div>

        <div class="controls">
            <button id="startBtn" onclick="startDialog()" class="start-btn">
                🎙️ Начать диалог
            </button>
            <button id="stopBtn" onclick="stopDialog()" class="stop-btn" style="display: none;">
                ⏹️ Остановить
            </button>
        </div>

        <!-- Промежуточный текст -->
        <div id="partialContainer" class="partial-container">
            <div class="partial-label">Распознаётся...</div>
            <div id="partialText" class="partial-text"></div>
        </div>

        <!-- Контейнер для обоих эквалайзеров -->
        <div class="visualizers-wrapper">
            <!-- Эквалайзер записи (слева) -->
            <div id="visualizerContainer" class="visualizer-container">
                <canvas id="visualizer" width="300" height="80"></canvas>
                <div class="volume-indicator">
                    Уровень звука: <span id="volumeLevel">0</span>%
                </div>
            </div>

            <!-- Эквалайзер воспроизведения (справа) -->
            <div id="playbackVisualizerContainer" class="playback-visualizer-container">
                <canvas id="playback-visualizer" width="300" height="80"></canvas>
                <div class="playback-label">
                    🔊 Воспроизведение ответа
                </div>
            </div>
        </div>

        <div id="conversation" class="conversation">
            <div class="empty-state">
                Начните диалог, чтобы увидеть историю разговора...
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let ws = null;
        let mediaStream = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        let audioProcessor = null;
        let audioSourceNode = null;
        let isDialogActive = false;
        let currentState = 'idle';

        // Переменные для потокового ответа
        let currentStreamingMessage = null;
        let currentStreamingText = '';
        let currentAudioChunks = [];
        let isPlayingAudio = false;
        let audioContextForPlayback = null;
        let currentAudioElements = []; // Массив активных audio элементов для остановки
        let processAudioChunksPromise = null; // Promise текущего процесса воспроизведения (для предотвращения параллельных вызовов)
        let currentPlayingElement = null; // Текущий воспроизводимый audio элемент (для строго последовательного воспроизведения)

        // Простой VAD на основе громкости
        let isSpeaking = false;
        let silenceStart = null;
        let speechStart = null;
        let vadCheckInterval = null;
        const SPEECH_THRESHOLD = 15; // Порог громкости для детекции речи (%)
        const INTERRUPT_THRESHOLD = 18; // Порог для прерывания (немного выше обычного)
        const INTERRUPT_MIN_DURATION = 300; // Минимальная длительность громкого звука для прерывания (0.3 сек)
        const SILENCE_DURATION = 500; // Миллисекунды тишины для завершения фразы (0.5 сек)
        const MIN_SPEECH_DURATION = 300; // Минимальная длительность речи
        let interruptSpeechStart = null; // Время начала речи для прерывания

        const statusDiv = document.getElementById('status');
        const conversationDiv = document.getElementById('conversation');
        const partialContainer = document.getElementById('partialContainer');
        const partialText = document.getElementById('partialText');
        const visualizerContainer = document.getElementById('visualizerContainer');
        const volumeLevel = document.getElementById('volumeLevel');
        const playbackVisualizerContainer = document.getElementById('playbackVisualizerContainer');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // Переменные для эквалайзера воспроизведения
        let playbackAnalyser = null;
        let playbackDataArray = null;
        let playbackAnimationId = null;
        let playbackAudioContext = null;

        // Запускаем визуализатор воспроизведения при загрузке страницы
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                startPlaybackVisualizer();
            });
        } else {
            // DOM уже загружен
            setTimeout(() => {
                startPlaybackVisualizer();
            }, 100);
        }

        // Обновление статуса
        function updateStatus(text, state) {
            statusDiv.textContent = text;
            statusDiv.className = `status ${state}`;
            currentState = state;
        }

        // Визуализатор звука
        function setupVisualizer(stream) {
            // Создаем AudioContext с частотой 16kHz для совместимости с Vosk
            audioContext = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: 16000
            });
            analyser = audioContext.createAnalyser();
            audioSourceNode = audioContext.createMediaStreamSource(stream);
            audioSourceNode.connect(analyser);
            analyser.fftSize = 256;

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            console.log('✅ AudioContext создан с частотой:', audioContext.sampleRate, 'Hz');

            // visualizerContainer теперь всегда видим, не нужно добавлять класс
            drawVisualizer();
        }

        function drawVisualizer() {
            if (!isDialogActive || !analyser) return;

            animationId = requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);

            const canvas = document.getElementById('visualizer');
            const canvasCtx = canvas.getContext('2d');
            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;

            canvasCtx.fillStyle = 'rgb(245, 245, 245)';
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);

            const barWidth = (WIDTH / dataArray.length) * 2.5;
            let x = 0;

            // Вычисляем средний уровень
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            const volumePercent = Math.round((average / 255) * 100);
            volumeLevel.textContent = volumePercent;

            // Рисуем столбцы
            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * HEIGHT;
                const gradient = canvasCtx.createLinearGradient(0, HEIGHT - barHeight, 0, HEIGHT);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, HEIGHT - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        function stopVisualizer() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            // visualizerContainer теперь всегда видим, не нужно скрывать
            volumeLevel.textContent = '0';
        }

        // Визуализатор воспроизведения - всегда активен, но показывает данные только когда идет воспроизведение
        function startPlaybackVisualizer() {
            if (playbackAnimationId) {
                console.log('ℹ️ Визуализатор воспроизведения уже запущен');
                return; // Уже запущен
            }

            // Создаем AudioContext если еще не создан
            if (!playbackAudioContext) {
                playbackAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                playbackAnalyser = playbackAudioContext.createAnalyser();
                playbackAnalyser.fftSize = 256;
                playbackAnalyser.smoothingTimeConstant = 0.8;
                playbackDataArray = new Uint8Array(playbackAnalyser.frequencyBinCount);
                console.log('✅ AudioContext для воспроизведения создан');
            }

            // Запускаем цикл анимации
            console.log('🎨 Запуск визуализатора воспроизведения...');
            playbackAnimationId = requestAnimationFrame(drawPlaybackVisualizer);
        }

        function drawPlaybackVisualizer() {
            // Запланировать следующий кадр ПЕРЕД проверок, чтобы анимация продолжалась
            playbackAnimationId = requestAnimationFrame(drawPlaybackVisualizer);

            const canvas = document.getElementById('playback-visualizer');
            if (!canvas) {
                playbackAnimationId = null;
                return;
            }

            const canvasCtx = canvas.getContext('2d');
            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;

            canvasCtx.fillStyle = 'rgb(232, 245, 233)';
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);

            // Если есть активный анализатор и он подключен к воспроизводимому аудио
            if (playbackAnalyser && playbackDataArray) {
                playbackAnalyser.getByteFrequencyData(playbackDataArray);

                const barWidth = (WIDTH / playbackDataArray.length) * 2.5;
                let x = 0;

                for (let i = 0; i < playbackDataArray.length; i++) {
                    const barHeight = (playbackDataArray[i] / 255) * HEIGHT;
                    const gradient = canvasCtx.createLinearGradient(0, HEIGHT - barHeight, 0, HEIGHT);
                    gradient.addColorStop(0, '#4caf50');
                    gradient.addColorStop(1, '#81c784');
                    canvasCtx.fillStyle = gradient;
                    canvasCtx.fillRect(x, HEIGHT - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            } else {
                // Если нет активного воспроизведения, показываем плоскую линию
                canvasCtx.fillStyle = '#c8e6c9';
                canvasCtx.fillRect(0, HEIGHT - 2, WIDTH, 2);
            }
        }

        function stopPlaybackVisualizer() {
            if (playbackAnimationId) {
                cancelAnimationFrame(playbackAnimationId);
                playbackAnimationId = null;
            }
            // Эквалайзер остается видимым, просто показывает 0 уровень
        }

        // WebSocket подключение
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/voice`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('✅ WebSocket подключен');
                ws.send(JSON.stringify({ type: 'start_listening' }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('📨 Получено:', data);

                switch (data.type) {
                    case 'state':
                        void handleStateChange(data.state);
                        break;
                    case 'partial_transcript':
                        showPartialTranscript(data.text);
                        break;
                    case 'final_transcript':
                        addMessage('user', data.text);
                        hidePartialTranscript();
                        break;
                    case 'ai_response':
                        // Старый формат (для обратной совместимости)
                        addMessage('assistant', data.text, data.audio_url);
                        break;
                    case 'stream_start':
                        handleStreamStart();
                        break;
                    case 'text_chunk':
                        handleTextChunk(data.text);
                        break;
                    case 'audio_chunk':
                        handleAudioChunk(data.data);
                        break;
                    case 'stream_end':
                        handleStreamEnd(data.text);
                        break;
                    case 'error':
                        console.error('❌ Ошибка:', data.message);
                        updateStatus('❌ Ошибка: ' + data.message, 'idle');
                        break;
                }
            };

            ws.onerror = (error) => {
                console.error('❌ WebSocket ошибка:', error);
                updateStatus('❌ Ошибка подключения', 'idle');
            };

            ws.onclose = () => {
                console.log('👋 WebSocket отключен');
                if (isDialogActive) {
                    updateStatus('❌ Соединение потеряно', 'idle');
                    stopDialog();
                }
            };
        }

        // Обработка изменения состояния
        async function handleStateChange(state) {
            switch (state) {
                case 'listening':
                    console.log('📡 Состояние: LISTENING');
                    updateStatus('🎧 Слушаю... Говорите!', 'listening');

                    // Останавливаем все активные воспроизведения (для случая прерывания)
                    if (currentAudioElements.length > 0 || isPlayingAudio) {
                        console.log('⏹️ Остановка воспроизведений при переходе в listening...');
                        currentAudioElements.forEach((audioEl) => {
                            try {
                                // Сначала останавливаем воспроизведение
                                if (!audioEl.paused) {
                                    audioEl.pause();
                                }
                                audioEl.currentTime = 0;
                                // Очищаем src только после полной остановки
                                audioEl.src = '';
                                audioEl.load(); // Перезагружаем элемент
                            } catch (e) {
                                console.error('❌ Ошибка остановки audio:', e);
                            }
                        });
                        currentAudioElements = [];
                        isPlayingAudio = false;
                        currentAudioChunks = [];
                        processAudioChunksPromise = null; // Сбрасываем Promise
                        // Останавливаем текущий элемент если есть
                        if (currentPlayingElement) {
                            try {
                                currentPlayingElement.pause();
                                currentPlayingElement.src = '';
                                currentPlayingElement.load();
                            } catch (e) { }
                            currentPlayingElement = null;
                        }
                    }

                    // Возобновляем VAD и запись
                    if (!vadCheckInterval) {
                        vadCheckInterval = setInterval(checkVoiceActivity, 100);
                        console.log('✅ VAD активирован');
                    }

                    // Если переходим в listening после прерывания и пользователь все еще говорит
                    if (isSpeaking && speechStart) {
                        console.log('🎤 Продолжаем запись после прерывания');
                        await startAudioRecording();
                        // НЕ сбрасываем isSpeaking, speechStart - пусть запись продолжится
                        silenceStart = null;
                        interruptSpeechStart = null;
                    } else {
                        // Сбрасываем состояние VAD для корректной обработки новой речи
                        isSpeaking = false;
                        silenceStart = null;
                        speechStart = null;
                        interruptSpeechStart = null; // Сбрасываем счетчик прерывания
                    }
                    break;
                case 'processing':
                    console.log('📡 Состояние: PROCESSING');
                    updateStatus('⏳ Обрабатываю запрос...', 'processing');
                    // Останавливаем VAD и запись на время обработки
                    if (vadCheckInterval) {
                        clearInterval(vadCheckInterval);
                        vadCheckInterval = null;
                        console.log('⏸️ VAD приостановлен (обработка)');
                    }
                    stopAudioRecording();
                    break;
                case 'speaking':
                    console.log('📡 Состояние: SPEAKING - currentState установлен в:', currentState);
                    updateStatus('🔊 Отвечаю...', 'speaking');

                    // ОСТАВЛЯЕМ VAD и запись активными для детекции прерывания
                    // VAD продолжает работать чтобы детектировать речь пользователя
                    if (!vadCheckInterval) {
                        vadCheckInterval = setInterval(checkVoiceActivity, 100);
                        console.log('✅ VAD активирован для детекции прерывания, интервал ID:', vadCheckInterval);
                    } else {
                        console.log('ℹ️ VAD уже активен, интервал ID:', vadCheckInterval);
                    }
                    // НЕ останавливаем запись аудио чтобы детектировать прерывание
                    break;
            }
        }

        // Отображение промежуточного текста
        function showPartialTranscript(text) {
            if (text) {
                partialText.textContent = text;
                // Контейнер всегда видим, просто обновляем текст
            }
        }

        function hidePartialTranscript() {
            partialText.textContent = '';
            // Контейнер остается видимым, просто очищаем текст
        }

        // Обработка начала потокового ответа
        function handleStreamStart() {
            console.log('🔄 Начало потокового ответа');
            const emptyState = conversationDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            // Создаем новое сообщение ассистента
            currentStreamingMessage = document.createElement('div');
            currentStreamingMessage.className = 'message assistant';
            currentStreamingMessage.innerHTML = `
                <div class="message-label">🤖 Ассистент</div>
                <div class="message-text streaming-text"></div>
            `;
            conversationDiv.appendChild(currentStreamingMessage);
            conversationDiv.scrollTop = conversationDiv.scrollHeight;

            currentStreamingText = '';
            currentAudioChunks = [];
            isPlayingAudio = false;
            currentPlayingElement = null; // Сбрасываем текущий элемент при начале нового потока
        }

        // Обработка текстового чанка
        function handleTextChunk(text) {
            if (!currentStreamingMessage) return;

            currentStreamingText += text;
            const textElement = currentStreamingMessage.querySelector('.streaming-text');
            if (textElement) {
                // Используем textContent для правильного отображения пробелов
                textElement.textContent = currentStreamingText;
            }
            conversationDiv.scrollTop = conversationDiv.scrollHeight;
        }

        // Обработка аудио чанка
        async function handleAudioChunk(base64Data) {
            try {
                console.log('📦 Получен аудио чанк, размер:', base64Data.length, 'символов');

                // Декодируем base64 в ArrayBuffer
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                console.log('📦 Декодировано', bytes.length, 'байт аудио');

                // Добавляем в массив чанков (WebM данные от Edge TTS)
                currentAudioChunks.push(bytes);
                console.log('📦 Всего чанков в буфере:', currentAudioChunks.length);

                // Пытаемся воспроизвести если еще не воспроизводим и нет активного процесса
                if (!isPlayingAudio && !processAudioChunksPromise) {
                    console.log('🎵 Запуск воспроизведения...');
                    processAudioChunksPromise = processAudioChunks();
                    processAudioChunksPromise.finally(() => {
                        processAudioChunksPromise = null;
                    });
                }
            } catch (error) {
                console.error('❌ Ошибка обработки аудио чанка:', error);
            }
        }

        // Обработка и воспроизведение накопленных аудио чанков
        async function processAudioChunks() {
            // Защита от параллельных вызовов
            if (processAudioChunksPromise) {
                console.log('⏸️ Уже обрабатываются чанки, пропускаем');
                return processAudioChunksPromise;
            }

            if (currentAudioChunks.length === 0 && !isPlayingAudio) {
                console.log('📭 Нет чанков для воспроизведения');
                return;
            }

            isPlayingAudio = true;
            console.log('🎵 Начало воспроизведения, чанков:', currentAudioChunks.length);

            // Создаем очередь для воспроизведения
            const playbackQueue = [];

            // Периодически проверяем новые чанки и воспроизводим их
            const checkInterval = setInterval(async () => {
                // Проверяем что диалог еще активен
                if (!isDialogActive) {
                    console.log('⏹️ Диалог остановлен, прекращаем проверку чанков');
                    clearInterval(checkInterval);
                    return;
                }

                if (currentAudioChunks.length > 0) {
                    // Берем все новые чанки
                    const chunksToPlay = currentAudioChunks.splice(0);
                    playbackQueue.push(...chunksToPlay);
                    console.log('📦 Добавлено в очередь:', chunksToPlay.length, 'чанков, всего в очереди:', playbackQueue.length);
                }
            }, 200); // Проверяем каждые 200мс

            // Воспроизводим чанки из очереди СТРОГО ПОСЛЕДОВАТЕЛЬНО
            while ((playbackQueue.length > 0 || currentAudioChunks.length > 0) && isDialogActive) {
                // Проверяем что диалог еще активен
                if (!isDialogActive) {
                    console.log('⏹️ Диалог остановлен, прекращаем воспроизведение');
                    clearInterval(checkInterval);
                    isPlayingAudio = false;
                    // Очищаем текущий элемент
                    if (currentPlayingElement) {
                        try {
                            currentPlayingElement.pause();
                            currentPlayingElement.src = '';
                            currentPlayingElement.load();
                        } catch (e) { }
                        currentPlayingElement = null;
                    }
                    return;
                }

                // Ждем пока в очереди будут чанки И предыдущий элемент завершился
                if (playbackQueue.length === 0 || currentPlayingElement) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    continue;
                }

                try {
                    // Берем чанки для воспроизведения (накапливаем несколько для более плавного воспроизведения)
                    const chunksToPlay = playbackQueue.splice(0, Math.min(playbackQueue.length, 10)); // Берем максимум 10 чанков за раз

                    if (chunksToPlay.length === 0) continue;

                    console.log('▶️ Воспроизведение', chunksToPlay.length, 'чанков, размер:', chunksToPlay.reduce((sum, chunk) => sum + chunk.length, 0), 'байт');

                    // Объединяем чанки в один Blob
                    // Edge TTS возвращает MP3 (audio/mpeg) для совместимости с Safari
                    const audioBlob = new Blob(chunksToPlay, { type: 'audio/mpeg' });
                    const audioUrl = URL.createObjectURL(audioBlob);

                    // Создаем audio элемент для воспроизведения
                    const audioElement = new Audio(audioUrl);

                    // Добавляем более детальное логирование ошибок
                    audioElement.addEventListener('loadstart', () => console.log('🔄 Аудио: loadstart'));
                    audioElement.addEventListener('loadeddata', () => console.log('✅ Аудио: loadeddata'));
                    audioElement.addEventListener('canplay', () => console.log('▶️ Аудио: canplay'));
                    audioElement.addEventListener('canplaythrough', () => console.log('✅ Аудио: canplaythrough'));

                    // Убеждаемся, что визуализатор инициализирован
                    if (!playbackAudioContext || !playbackAnalyser) {
                        startPlaybackVisualizer();
                    }

                    // Разблокируем AudioContext если он в suspended состоянии
                    if (playbackAudioContext && playbackAudioContext.state === 'suspended') {
                        console.log('🔓 Разблокировка AudioContext...');
                        try {
                            await playbackAudioContext.resume();
                            console.log('✅ AudioContext разблокирован');
                        } catch (e) {
                            console.warn('⚠️ Не удалось разблокировать AudioContext:', e);
                        }
                    }

                    // Убеждаемся, что визуализатор запущен
                    if (!playbackAnimationId) {
                        startPlaybackVisualizer();
                    }

                    // Подключаем audio элемент к анализатору через MediaElementSource
                    // ВАЖНО: Создаем source только один раз для каждого audio элемента
                    // и делаем это ДО начала воспроизведения
                    if (!audioElement._mediaSourceCreated && playbackAudioContext && playbackAnalyser) {
                        try {
                            const source = playbackAudioContext.createMediaElementSource(audioElement);
                            // ВАЖНО: После создания MediaElementSource, audio элемент больше не подключен к destination
                            // Подключаем цепочку: source -> analyser -> destination
                            source.connect(playbackAnalyser);
                            playbackAnalyser.connect(playbackAudioContext.destination);
                            audioElement._mediaSourceCreated = true; // Помечаем, что source уже создан
                            console.log('✅ MediaElementSource создан и подключен для визуализации');
                            console.log('📊 Анализатор подключен, готов к визуализации');
                        } catch (e) {
                            console.warn('⚠️ Не удалось создать MediaElementSource:', e);
                            console.warn('⚠️ Детали ошибки:', e.name, e.message);
                            // Если уже был создан source для этого элемента, это нормально
                            if (e.name === 'InvalidStateError' && (e.message.includes('MediaElementSource') || e.message.includes('already been connected'))) {
                                console.log('ℹ️ MediaElementSource уже существует для этого элемента');
                                audioElement._mediaSourceCreated = true; // Помечаем чтобы не пытаться снова
                            }
                            // Продолжаем без визуализации
                        }
                    } else if (!audioElement._mediaSourceCreated) {
                        console.warn('⚠️ Невозможно создать MediaElementSource: playbackAudioContext или playbackAnalyser не инициализирован');
                    } else {
                        console.log('ℹ️ MediaElementSource уже создан для этого элемента, пропускаем');
                    }

                    // Устанавливаем текущий воспроизводимый элемент
                    currentPlayingElement = audioElement;

                    // Добавляем в массив для возможности остановки
                    currentAudioElements.push(audioElement);

                    // Удаляем из массива когда завершится
                    audioElement.addEventListener('ended', () => {
                        // Очищаем текущий элемент только если это он
                        if (currentPlayingElement === audioElement) {
                            currentPlayingElement = null;
                        }
                        const index = currentAudioElements.indexOf(audioElement);
                        if (index > -1) {
                            currentAudioElements.splice(index, 1);
                        }
                    });

                    // Функция проверки пустого src
                    const isSrcEmpty = (el) => {
                        if (!el.src || el.src === '' || el.src === window.location.href) {
                            return true;
                        }
                        // Проверяем что src не является blob URL (blob URLs валидны)
                        // Если src не начинается с blob:, но также не является пустым - это может быть ошибка
                        // Однако мы проверяем только пустые случаи
                        return false;
                    };

                    // Добавляем обработчики ошибок (игнорируем ошибки если src уже очищен)
                    const errorHandler = (e) => {
                        // Игнорируем ошибки с пустым src (это нормально при остановке)
                        const srcEmpty = isSrcEmpty(audioElement);
                        if (srcEmpty || audioElement.error?.code === 4) {
                            // Код 4 = MEDIA_ERR_SRC_NOT_SUPPORTED = Empty src attribute
                            if (currentPlayingElement === audioElement) {
                                currentPlayingElement = null;
                            }
                            const index = currentAudioElements.indexOf(audioElement);
                            if (index > -1) {
                                currentAudioElements.splice(index, 1);
                            }
                            return;
                        }

                        console.error('❌ Ошибка audio элемента:', e, audioElement.error);
                        if (audioElement.error) {
                            console.error('Код ошибки:', audioElement.error.code);
                            console.error('Сообщение:', audioElement.error.message);
                        }
                        if (currentPlayingElement === audioElement) {
                            currentPlayingElement = null;
                        }
                        const index = currentAudioElements.indexOf(audioElement);
                        if (index > -1) {
                            currentAudioElements.splice(index, 1);
                        }
                    };
                    audioElement.addEventListener('error', errorHandler);

                    // Воспроизводим и ждем окончания
                    try {
                        // Проверяем что диалог еще активен перед воспроизведением
                        if (!isDialogActive) {
                            console.log('⏹️ Диалог остановлен, пропускаем воспроизведение');
                            URL.revokeObjectURL(audioUrl);
                            clearInterval(checkInterval);
                            isPlayingAudio = false;
                            return;
                        }

                        // Проверяем готовность к воспроизведению (только если src не пустой)
                        if (!isSrcEmpty(audioElement) && audioElement.readyState < 2) {
                            console.log('⏳ Ожидание загрузки аудио... (readyState:', audioElement.readyState, ')');
                            await new Promise((resolve, reject) => {
                                const timeout = setTimeout(() => {
                                    console.warn('⏰ Таймаут загрузки аудио');
                                    reject(new Error('Таймаут загрузки аудио'));
                                }, 5000);
                                audioElement.addEventListener('canplay', () => {
                                    clearTimeout(timeout);
                                    console.log('✅ Аудио готово к воспроизведению');
                                    resolve();
                                }, { once: true });
                                audioElement.addEventListener('error', () => {
                                    clearTimeout(timeout);
                                    // Игнорируем ошибки с пустым src (это нормально при остановке)
                                    if (isSrcEmpty(audioElement) || audioElement.error?.code === 4) {
                                        console.log('ℹ️ Ошибка загрузки с пустым src (игнорируем)');
                                        resolve(); // Разрешаем вместо reject чтобы не прерывать цикл
                                        return;
                                    }
                                    console.error('❌ Ошибка при загрузке аудио:', audioElement.error);
                                    resolve(); // Разрешаем чтобы не прерывать цикл, просто пропустим этот элемент
                                }, { once: true });
                            });
                        }

                        // Еще раз проверяем после await
                        if (!isDialogActive || isSrcEmpty(audioElement)) {
                            console.log('⏹️ Диалог остановлен или src очищен, пропускаем воспроизведение');
                            URL.revokeObjectURL(audioUrl);
                            if (currentPlayingElement === audioElement) {
                                currentPlayingElement = null;
                            }
                            clearInterval(checkInterval);
                            isPlayingAudio = false;
                            return;
                        }

                        // Попытка воспроизведения
                        console.log('🎬 Попытка запуска воспроизведения (readyState:', audioElement.readyState, ')');
                        const playPromise = audioElement.play();

                        if (playPromise !== undefined) {
                            await playPromise;
                        }
                        console.log('▶️ Воспроизведение запущено успешно');

                        // Ждем окончания воспроизведения
                        await new Promise((resolve) => {
                            const timeout = setTimeout(() => {
                                console.log('⏰ Таймаут ожидания окончания воспроизведения');
                                URL.revokeObjectURL(audioUrl);
                                resolve();
                            }, 30000); // 30 секунд максимум

                            audioElement.onended = () => {
                                clearTimeout(timeout);
                                console.log('✅ Воспроизведение завершено');
                                URL.revokeObjectURL(audioUrl);
                                // Очищаем текущий элемент
                                if (currentPlayingElement === audioElement) {
                                    currentPlayingElement = null;
                                }
                                // Не останавливаем визуализатор при окончании одного элемента,
                                // так как могут быть другие элементы в очереди
                                resolve();
                            };

                            audioElement.onerror = (error) => {
                                clearTimeout(timeout);
                                // Игнорируем ошибки с пустым src (это нормально при остановке)
                                if (isSrcEmpty(audioElement) || audioElement.error?.code === 4) {
                                    console.log('ℹ️ Ошибка воспроизведения с пустым src (игнорируем)');
                                } else {
                                    console.error('❌ Ошибка воспроизведения:', error, audioElement.error);
                                }
                                URL.revokeObjectURL(audioUrl);
                                // Очищаем текущий элемент
                                if (currentPlayingElement === audioElement) {
                                    currentPlayingElement = null;
                                }
                                resolve();
                            };
                        });
                    } catch (playError) {
                        console.error('❌ Ошибка запуска воспроизведения:', playError);
                        URL.revokeObjectURL(audioUrl);
                    }

                } catch (error) {
                    console.error('❌ Ошибка обработки чанков:', error);
                }
            }

            clearInterval(checkInterval);

            // Ждем завершения текущего элемента если он есть
            if (currentPlayingElement) {
                console.log('⏳ Ожидание завершения текущего воспроизведения...');
                await new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        console.log('⏰ Таймаут ожидания текущего элемента');
                        if (currentPlayingElement) {
                            currentPlayingElement.pause();
                            currentPlayingElement = null;
                        }
                        resolve();
                    }, 5000);

                    const checkEnded = () => {
                        if (!currentPlayingElement || currentPlayingElement.ended || currentPlayingElement.paused) {
                            clearTimeout(timeout);
                            currentPlayingElement = null;
                            resolve();
                        } else {
                            setTimeout(checkEnded, 100);
                        }
                    };
                    checkEnded();
                });
            }

            isPlayingAudio = false;
            currentPlayingElement = null;
            console.log('🏁 Воспроизведение всех чанков завершено');
        }

        // Обработка конца потокового ответа
        function handleStreamEnd(fullText) {
            console.log('✅ Потоковый ответ завершен, текст:', fullText);
            console.log('📊 Статистика: чанков в буфере:', currentAudioChunks.length, 'воспроизводится:', isPlayingAudio);

            // Обновляем финальный текст если нужно
            if (fullText && currentStreamingText !== fullText) {
                currentStreamingText = fullText;
                const textElement = currentStreamingMessage.querySelector('.streaming-text');
                if (textElement) {
                    textElement.textContent = fullText;
                }
            }

            // Устанавливаем флаг что поток завершен
            const streamEnded = true;

            // Воспроизводим оставшиеся чанки только если еще не начали воспроизведение
            if (!isPlayingAudio && !processAudioChunksPromise) {
                if (currentAudioChunks.length > 0) {
                    processAudioChunksPromise = processAudioChunks();
                    processAudioChunksPromise.then(() => {
                        console.log('✅ Все аудио чанки обработаны');
                        processAudioChunksPromise = null;
                        sendSpeakingFinished();
                    }).catch((error) => {
                        console.error('❌ Ошибка при обработке аудио чанков:', error);
                        processAudioChunksPromise = null;
                        sendSpeakingFinished();
                    });
                } else {
                    console.log('📭 Нет чанков для воспроизведения');
                    sendSpeakingFinished();
                }
            } else {
                // Если воспроизведение уже идет, просто ждем его окончания
                console.log('⏳ Ожидание окончания воспроизведения...');
                if (processAudioChunksPromise) {
                    processAudioChunksPromise.then(() => {
                        processAudioChunksPromise = null;
                        sendSpeakingFinished();
                    }).catch(() => {
                        processAudioChunksPromise = null;
                        sendSpeakingFinished();
                    });
                } else {
                    sendSpeakingFinished();
                }
            }

            function sendSpeakingFinished() {
                console.log('🔄 Запуск проверки окончания воспроизведения...');

                let attempts = 0;
                const maxAttempts = 100; // 20 секунд (100 * 200ms)

                // Ждем окончания воспроизведения всех аудио чанков
                const checkPlaybackFinished = setInterval(() => {
                    attempts++;
                    console.log(`🔍 Проверка ${attempts}/${maxAttempts}: воспроизводится=${isPlayingAudio}, чанков=${currentAudioChunks.length}`);

                    if (!isPlayingAudio && currentAudioChunks.length === 0) {
                        clearInterval(checkPlaybackFinished);

                        // Отправляем speaking_finished
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'speaking_finished' }));
                            console.log('✅ speaking_finished отправлен');
                        } else {
                            console.error('❌ WebSocket не готов для отправки speaking_finished');
                        }
                    }

                    if (attempts >= maxAttempts) {
                        clearInterval(checkPlaybackFinished);
                        console.log('⏰ Таймаут ожидания окончания воспроизведения, отправляем speaking_finished');
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'speaking_finished' }));
                            console.log('✅ speaking_finished отправлен (таймаут)');
                        }
                    }
                }, 200); // Проверяем каждые 200мс

                // Fallback: если через 30 секунд все еще не закончилось, отправляем anyway
                setTimeout(() => {
                    clearInterval(checkPlaybackFinished);
                    console.log('⏰ Финальный таймаут, принудительно отправляем speaking_finished');
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'speaking_finished' }));
                        console.log('✅ speaking_finished отправлен (финальный таймаут)');
                    }
                }, 30000);
            }
        }

        // Добавление сообщения в историю
        function addMessage(role, text, audioUrl = null) {
            const emptyState = conversationDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let content = `
                <div class="message-label">
                    ${role === 'user' ? '👤 Вы' : '🤖 Ассистент'}
                </div>
                <div class="message-text">${text}</div>
            `;

            if (audioUrl) {
                content += `
                    <div class="audio-player">
                        <audio id="response-audio" controls>
                            <source src="${audioUrl}" type="audio/wav">
                        </audio>
                    </div>
                `;
            }

            messageDiv.innerHTML = content;
            conversationDiv.appendChild(messageDiv);
            conversationDiv.scrollTop = conversationDiv.scrollHeight;

            // Автовоспроизведение ответа
            if (role === 'assistant' && audioUrl) {
                const audioElement = messageDiv.querySelector('audio');
                let speakingFinishedSent = false;
                let fallbackTimer = null;

                // Функция для отправки speaking_finished (с защитой от дублирования)
                const sendSpeakingFinished = (source) => {
                    if (speakingFinishedSent) {
                        console.log(`⚠️ speaking_finished уже был отправлен, игнорируем (источник: ${source})`);
                        return;
                    }
                    speakingFinishedSent = true;

                    console.log(`🔄 Отправка speaking_finished (источник: ${source})`);
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'speaking_finished' }));
                        console.log('✅ speaking_finished отправлен');
                    } else {
                        console.error('❌ WebSocket не готов');
                    }

                    // Очищаем таймер если он еще работает
                    if (fallbackTimer) {
                        clearTimeout(fallbackTimer);
                        fallbackTimer = null;
                    }
                };

                // Event listener для окончания воспроизведения
                audioElement.addEventListener('ended', () => {
                    console.log('🎵 Аудио закончилось (ended event)');
                    sendSpeakingFinished('ended event');
                }, { once: true });

                // Детекция прерывания теперь встроена в VAD
                audioElement.addEventListener('play', () => {
                    console.log('▶️ Начато воспроизведение ответа');
                });

                // Автовоспроизведение с задержкой для загрузки
                console.log('🎵 Попытка автовоспроизведения аудио:', audioUrl);

                // Добавляем event listeners для диагностики
                audioElement.addEventListener('error', (e) => {
                    console.error('❌ Ошибка загрузки аудио:', e, audioElement.error);
                });

                audioElement.addEventListener('loadeddata', () => {
                    const duration = audioElement.duration;
                    console.log('📥 Аудио загружено, длительность:', duration, 'сек');

                    // Устанавливаем fallback таймер: duration + 500ms запаса
                    const fallbackDelay = (duration * 1000) + 500;
                    fallbackTimer = setTimeout(() => {
                        console.log('⏰ Fallback таймер сработал');
                        sendSpeakingFinished('fallback timer');
                    }, fallbackDelay);
                    console.log(`⏲️ Fallback таймер установлен на ${fallbackDelay}ms`);

                    // Запускаем автовоспроизведение после загрузки
                    const playPromise = audioElement.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                console.log('✅ Автовоспроизведение запущено успешно');
                            })
                            .catch(error => {
                                console.error('❌ Автовоспроизведение заблокировано:', error.message);
                                console.log('ℹ️ Нажмите кнопку play вручную');
                            });
                    }
                });

                // Fallback: если loadeddata не сработал в течение 500ms
                setTimeout(() => {
                    if (audioElement.readyState >= 2) {
                        console.log('📥 Fallback: запуск воспроизведения');
                        const playPromise = audioElement.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => {
                                    console.log('✅ Автовоспроизведение запущено (fallback)');
                                })
                                .catch(error => {
                                    console.error('❌ Автовоспроизведение заблокировано (fallback):', error.message);
                                });
                        }
                    }
                }, 500);
            }
        }

        // Простой VAD на основе громкости (с детекцией прерывания)
        let lastDebugLog = 0;
        async function checkVoiceActivity() {
            const now = Date.now();

            // Отладочное логирование раз в секунду
            if (currentState === 'speaking' && now - lastDebugLog > 1000) {
                console.log('🔍 VAD проверка: analyser=', !!analyser, 'isDialogActive=', isDialogActive, 'currentState=', currentState);
                lastDebugLog = now;
            }

            if (!analyser || !isDialogActive) return;

            analyser.getByteFrequencyData(dataArray);

            // Вычисляем средний уровень
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            const volumePercent = Math.round((average / 255) * 100);

            // Если мы в состоянии speaking, используем более строгие критерии для прерывания
            if (currentState === 'speaking') {
                // Логируем громкость для отладки прерываний
                if (volumePercent > 10) {
                    console.log('🔊 Громкость во время speaking:', volumePercent, '% (порог прерывания:', INTERRUPT_THRESHOLD, '%)');
                }

                if (volumePercent > INTERRUPT_THRESHOLD) {
                    // Громкий звук обнаружен
                    if (!interruptSpeechStart) {
                        interruptSpeechStart = now;
                        console.log('🎤 Возможное прерывание (громкость:', volumePercent, '%), ожидаем подтверждения...');
                    } else {
                        // Проверяем длительность
                        const interruptDuration = now - interruptSpeechStart;
                        if (interruptDuration >= INTERRUPT_MIN_DURATION) {
                            console.log('⚠️ Подтверждено прерывание! (длительность:', interruptDuration, 'мс)');

                            // Останавливаем ВСЕ активные аудио элементы
                            console.log('⏹️ Остановка всех воспроизведений при прерывании...');
                            currentAudioElements.forEach((audioEl) => {
                                try {
                                    // Сначала останавливаем воспроизведение
                                    if (!audioEl.paused) {
                                        audioEl.pause();
                                    }
                                    audioEl.currentTime = 0;
                                    // Очищаем src только после полной остановки
                                    audioEl.src = '';
                                    audioEl.load(); // Перезагружаем элемент
                                    console.log('⏹️ Остановлен streaming audio элемент');
                                } catch (e) {
                                    console.error('❌ Ошибка остановки streaming audio:', e);
                                }
                            });
                            currentAudioElements = [];

                            // Останавливаем все audio элементы на странице
                            document.querySelectorAll('audio').forEach((audioEl) => {
                                try {
                                    if (!audioEl.paused) {
                                        audioEl.pause();
                                    }
                                    audioEl.currentTime = 0;
                                    // Не очищаем src для элементов в DOM, только останавливаем
                                    console.log('⏹️ Остановлен audio элемент из DOM');
                                } catch (e) {
                                    console.error('❌ Ошибка остановки audio из DOM:', e);
                                }
                            });

                            // Очищаем флаги и очереди воспроизведения
                            isPlayingAudio = false;
                            currentAudioChunks = [];
                            currentStreamingMessage = null;
                            currentStreamingText = '';
                            processAudioChunksPromise = null; // Сбрасываем Promise
                            // Останавливаем текущий элемент если есть
                            if (currentPlayingElement) {
                                try {
                                    currentPlayingElement.pause();
                                    currentPlayingElement.src = '';
                                    currentPlayingElement.load();
                                } catch (e) { }
                                currentPlayingElement = null;
                            }

                            // Отправляем interrupt на сервер
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({ type: 'interrupt' }));
                            }

                            // СРАЗУ начинаем записывать новую речь пользователя (не ждем ответа от сервера)
                            console.log('🎤 Немедленный запуск записи после прерывания');
                            isSpeaking = true;
                            speechStart = now;
                            silenceStart = null;

                            // Запускаем запись сразу
                            await startAudioRecording();
                            console.log('✅ Запись активирована для захвата речи при прерывании');

                            // interruptSpeechStart НЕ сбрасываем - он будет сброшен при переходе в listening
                            return;
                        }
                    }
                } else {
                    // Звук стал тише порога прерывания - сбрасываем счетчик
                    if (interruptSpeechStart) {
                        console.log('🔇 Звук стих, сбрасываем счетчик прерывания');
                        interruptSpeechStart = null;
                    }
                }
                return; // В состоянии speaking не обрабатываем обычную речь
            }

            // Обычная логика детекции речи (для состояния listening)
            if (volumePercent > SPEECH_THRESHOLD) {
                // Детектирована речь
                if (!isSpeaking) {
                    console.log('🎤 Начало речи (громкость:', volumePercent, '%)');
                    isSpeaking = true;
                    speechStart = now;
                    silenceStart = null;

                    // Нормальное начало речи в состоянии listening
                    await startAudioRecording();
                } else {
                    // Речь продолжается - сбрасываем таймер тишины
                    silenceStart = null;
                }
            } else {
                // Тишина
                if (isSpeaking) {
                    if (!silenceStart) {
                        silenceStart = now;
                        console.log('🔇 Началась тишина');
                    } else {
                        const silenceDuration = now - silenceStart;
                        const speechDuration = silenceStart - speechStart;

                        // Если тишина длится достаточно долго и речь была достаточно долгой
                        if (silenceDuration >= SILENCE_DURATION && speechDuration >= MIN_SPEECH_DURATION) {
                            console.log('✅ Конец фразы (речь:', speechDuration, 'мс, тишина:', silenceDuration, 'мс)');
                            isSpeaking = false;
                            silenceStart = null;
                            speechStart = null;

                            stopAudioRecording();
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({ type: 'speech_end' }));
                            }
                        }
                    }
                }
            }
        }

        // Настройка аудио захвата
        async function setupAudioCapture() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000
                    }
                });

                // Визуализатор (также используется для VAD)
                setupVisualizer(mediaStream);

                // Запускаем проверку голосовой активности каждые 100мс
                vadCheckInterval = setInterval(checkVoiceActivity, 100);
                console.log('✅ VAD запущен (на основе громкости)');

            } catch (error) {
                console.error('❌ Ошибка доступа к микрофону:', error);
                alert('Не удалось получить доступ к микрофону: ' + error.message);
                throw error;
            }
        }

        // Запись аудио для отправки на сервер (RAW PCM для Vosk)
        async function startAudioRecording() {
            if (!audioContext || !audioSourceNode) return;

            // Останавливаем старый процессор если он существует
            if (audioProcessor) {
                console.log('⚠️ Останавливаем старый процессор аудио');
                audioProcessor.disconnect();
                audioProcessor.port.onmessage = null;
                audioProcessor = null;
            }

            try {
                // Загружаем AudioWorklet модуль если ещё не загружен
                if (!audioContext.audioWorklet) {
                    console.error('❌ AudioWorklet не поддерживается в этом браузере');
                    return;
                }

                // Пытаемся добавить модуль (игнорируем ошибку если уже добавлен)
                try {
                    await audioContext.audioWorklet.addModule('/static/vad-processor.js');
                } catch (e) {
                    // Модуль уже загружен, продолжаем
                }

                // Создаем AudioWorkletNode для захвата raw PCM audio
                audioProcessor = new AudioWorkletNode(audioContext, 'vad-processor');

                audioProcessor.port.onmessage = (event) => {
                    const audioData = event.data.audioData;
                    sendPCMAudioChunk(audioData);
                };

                // Подключаем существующий источник к процессору
                audioSourceNode.connect(audioProcessor);
                audioProcessor.connect(audioContext.destination);
                console.log('🎙️ Начата запись PCM аудио (AudioWorklet)');
            } catch (error) {
                console.error('❌ Ошибка создания AudioWorklet:', error);
            }
        }

        function stopAudioRecording() {
            if (audioProcessor) {
                audioProcessor.disconnect();
                if (audioProcessor.port) {
                    audioProcessor.port.onmessage = null;
                }
                audioProcessor = null;
                console.log('⏹️ Запись PCM остановлена');
            }
            // Сбрасываем VAD переменные
            isSpeaking = false;
            silenceStart = null;
            speechStart = null;
        }

        // Конвертация Float32Array в Int16Array и отправка
        function sendPCMAudioChunk(float32Array) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            // Конвертируем Float32 [-1.0, 1.0] в Int16 [-32768, 32767]
            const int16Array = new Int16Array(float32Array.length);
            for (let i = 0; i < float32Array.length; i++) {
                const s = Math.max(-1, Math.min(1, float32Array[i]));
                int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }

            // Конвертируем в base64 для отправки
            const bytes = new Uint8Array(int16Array.buffer);
            const base64Audio = btoa(String.fromCharCode.apply(null, bytes));

            ws.send(JSON.stringify({
                type: 'audio_chunk',
                data: base64Audio
            }));
        }

        // Запуск диалога
        async function startDialog() {
            if (isDialogActive) return;

            try {
                // Полная очистка всех аудио данных перед началом нового диалога
                console.log('🧹 Очистка аудио данных перед новым диалогом...');

                // Останавливаем все аудио элементы
                currentAudioElements.forEach((audioEl) => {
                    try {
                        if (!audioEl.paused) {
                            audioEl.pause();
                        }
                        audioEl.currentTime = 0;
                        audioEl.src = '';
                        audioEl.load(); // Перезагружаем элемент
                        audioEl.remove();
                    } catch (e) {
                        console.error('Ошибка очистки audio:', e);
                    }
                });
                currentAudioElements = [];

                // Останавливаем все audio на странице (только останавливаем, не удаляем - они в DOM)
                document.querySelectorAll('audio').forEach((audioEl) => {
                    try {
                        if (!audioEl.paused) {
                            audioEl.pause();
                        }
                        audioEl.currentTime = 0;
                        // Не очищаем src для элементов в DOM
                    } catch (e) { }
                });

                // Очищаем буфер аудио чанков
                currentAudioChunks = [];
                isPlayingAudio = false;
                processAudioChunksPromise = null; // Сбрасываем Promise
                // Останавливаем текущий элемент если есть
                if (currentPlayingElement) {
                    try {
                        currentPlayingElement.pause();
                        currentPlayingElement.src = '';
                        currentPlayingElement.load();
                    } catch (e) { }
                    currentPlayingElement = null;
                }

                // Останавливаем визуализаторы
                stopPlaybackVisualizer();
                stopVisualizer();

                // Очищаем историю сообщений в UI
                conversationDiv.innerHTML = `
                    <div class="empty-state">
                        <p>💬 История сообщений пуста</p>
                        <p>Начните диалог, нажав кнопку ниже</p>
                    </div>
                `;

                // Очищаем историю на сервере (в LLM)
                try {
                    await fetch('/api/clear-history', { method: 'POST' });
                    console.log('✅ История на сервере очищена');
                } catch (e) {
                    console.error('❌ Ошибка очистки истории на сервере:', e);
                }

                console.log('✅ Аудио данные и история очищены');

                isDialogActive = true;
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';

                updateStatus('🔄 Подключение...', 'idle');

                // Настройка аудио
                await setupAudioCapture();

                // Подключение WebSocket
                connectWebSocket();

                updateStatus('🎧 Слушаю... Говорите!', 'listening');

            } catch (error) {
                console.error('❌ Ошибка запуска:', error);
                stopDialog();
            }
        }

        // Остановка диалога
        function stopDialog() {
            isDialogActive = false;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';

            // Останавливаем все активные воспроизведения аудио
            console.log('⏹️ Остановка всех воспроизведений...');

            // Останавливаем все аудио элементы из массива
            currentAudioElements.forEach((audioEl) => {
                try {
                    if (!audioEl.paused) {
                        audioEl.pause();
                    }
                    audioEl.currentTime = 0;
                    audioEl.src = ''; // Очищаем источник
                    audioEl.load(); // Перезагружаем элемент
                    console.log('⏹️ Остановлен audio элемент');
                } catch (e) {
                    console.error('❌ Ошибка остановки audio:', e);
                }
            });
            currentAudioElements = [];

            // Останавливаем все audio элементы на странице (для надежности)
            document.querySelectorAll('audio').forEach((audioEl) => {
                try {
                    if (!audioEl.paused) {
                        audioEl.pause();
                    }
                    audioEl.currentTime = 0;
                    // Не очищаем src для элементов в DOM, только останавливаем
                    console.log('⏹️ Остановлен audio элемент из DOM');
                } catch (e) {
                    console.error('❌ Ошибка остановки audio из DOM:', e);
                }
            });

            // Очищаем флаги воспроизведения
            isPlayingAudio = false;
            currentAudioChunks = [];
            processAudioChunksPromise = null; // Сбрасываем Promise
            // Останавливаем текущий элемент если есть
            if (currentPlayingElement) {
                try {
                    currentPlayingElement.pause();
                    currentPlayingElement.src = '';
                    currentPlayingElement.load();
                } catch (e) { }
                currentPlayingElement = null;
            }

            // Сбрасываем потоковые данные
            currentStreamingMessage = null;
            currentStreamingText = '';

            if (ws) {
                ws.send(JSON.stringify({ type: 'stop' }));
                ws.close();
                ws = null;
            }

            if (vadCheckInterval) {
                clearInterval(vadCheckInterval);
                vadCheckInterval = null;
            }

            if (audioProcessor) {
                audioProcessor.disconnect();
                audioProcessor = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            // Останавливаем визуализатор воспроизведения если есть
            stopPlaybackVisualizer();

            // Сброс VAD переменных
            isSpeaking = false;
            silenceStart = null;
            speechStart = null;
            interruptSpeechStart = null;

            stopVisualizer();
            hidePartialTranscript();
            updateStatus('✅ Готов к работе', 'idle');
        }

        // Горячая клавиша: Space
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                if (!isDialogActive) {
                    startDialog();
                } else {
                    stopDialog();
                }
            }
        });

        // Загрузка списка доступных моделей
        async function loadModels() {
            try {
                console.log('📋 Загрузка списка моделей...');
                const response = await fetch('/api/models');
                const data = await response.json();

                if (data.status === 'success') {
                    const selector = document.getElementById('modelSelector');
                    selector.innerHTML = ''; // Очищаем селект

                    // Добавляем модели в список
                    data.models.forEach(modelName => {
                        const option = document.createElement('option');
                        option.value = modelName;
                        option.textContent = modelName;

                        // Отмечаем текущую модель
                        if (modelName === data.current_model) {
                            option.selected = true;
                        }

                        selector.appendChild(option);
                    });

                    console.log(`✅ Загружено ${data.models.length} моделей, текущая: ${data.current_model}`);
                } else {
                    console.error('❌ Ошибка загрузки моделей:', data);
                }
            } catch (error) {
                console.error('❌ Ошибка при загрузке списка моделей:', error);
                const selector = document.getElementById('modelSelector');
                selector.innerHTML = '<option value="">Ошибка загрузки</option>';
            }
        }

        // Смена активной модели
        async function changeModel() {
            const selector = document.getElementById('modelSelector');
            const newModel = selector.value;

            if (!newModel) {
                console.warn('⚠️ Модель не выбрана');
                return;
            }

            try {
                console.log(`🔄 Смена модели на: ${newModel}`);
                const response = await fetch('/api/set-model', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model_name: newModel })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    console.log(`✅ ${data.message}`);
                    // Показываем уведомление пользователю
                    updateStatus(`✅ Модель изменена на ${newModel}`, 'idle');
                    setTimeout(() => {
                        updateStatus('Готов к работе', 'idle');
                    }, 2000);
                } else {
                    console.error('❌ Ошибка смены модели:', data);
                    alert('Ошибка при смене модели');
                }
            } catch (error) {
                console.error('❌ Ошибка при смене модели:', error);
                alert('Ошибка при смене модели: ' + error.message);
            }
        }

        // Загружаем список моделей при загрузке страницы
        window.addEventListener('load', () => {
            loadModels();
        });
    </script>
